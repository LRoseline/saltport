<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebView Preview</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.12/lib/marked.umd.min.js"></script>
    <style>
        body {
            padding: 0;
        }
        
        img {
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div id="content"></div>
    <script>
        function setMarkdown(mkText) {
            document.querySelector("#content").innerHTML = marked.parse(mkText);
        }
    </script>
</body>
</html>
