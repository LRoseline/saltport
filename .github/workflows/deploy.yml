name: Deploy Vite React App

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Fetch previous post data
        run: |
          git fetch origin gh-pages:gh-pages || true

          mkdir -p public/posts

          if git show gh-pages:posts/manifest.json > public/posts/manifest.json 2>/dev/null; then
            echo "Previous manifest found."
          else
            echo "No previous manifest."
            echo "{}" > public/posts/manifest.json
          fi

          for file in $(git ls-tree -r --name-only gh-pages posts/ 2>/dev/null | grep '^posts/.*\.json$' || true); do
            if [ "$file" != "posts/manifest.json" ]; then
              git show "gh-pages:$file" > "public/$file"
            fi
          done

      - name: Generate post list
        run: node scripts/generate-post-list.js

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages